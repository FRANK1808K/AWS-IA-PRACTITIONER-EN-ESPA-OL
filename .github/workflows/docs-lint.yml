name: docs-lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.23.2

      - name: Enlaces relativos y anclas
        run: python .github/scripts/check_links.py

      - name: JSON válido (políticas IAM y de OpenSearch Serverless)
        run: |
          find . -name '*.json' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 python -m json.tool > /dev/null

      - name: Sintaxis de los scripts Python
        run: python -m py_compile labs/*/scripts/*.py .github/scripts/*.py simulator/build.py

      - name: Simulador sincronizado con los simulacros
        run: |
          python simulator/build.py
          git diff --exit-code simulator/index.html
